name: Generate SBOM Report with Syft

on:
  push:
    branches:
      - master
  workflow_dispatch:
  pull_request:
    branches:
      - master

jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Syft
      run: |
        # GitHub Releases downloads returned 504 on 2026-11-08 -> use the Docker Hub image instead
        docker pull anchore/syft:latest

    - name: Generate SBOM
      run: |
        docker run --rm anchore/syft:latest docker.io/kodekloud/webapp-color:latest -o spdx-json > spdx.json

    - name: Upload SBOM Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sbom-report
        path: spdx.json
